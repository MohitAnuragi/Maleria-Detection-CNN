<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaria AI Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <h1>Malaria Cell Detection</h1>
            <p>Upload a microscopic blood cell image for AI analysis.</p>
        </header>

        <main>
            <div class="upload-box" id="uploadBox">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="icon">
                    <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
                <h3>Drag & Drop or Click to Upload</h3>
                <p>Supports PNG, JPG, JPEG</p>
            </div>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing cells with CNN...</p>
            </div>

            <div class="result-box hidden" id="resultBox">
                <img id="previewImage" src="" alt="Cell Preview">
                <div class="result-details">
                    <h2 id="predictionText">Parasitized</h2>
                    <div class="confidence-bar-bg">
                        <div class="confidence-bar-fill" id="confidenceBar"></div>
                    </div>
                    <p id="confidenceText">Confidence: 98%</p>
                    <button class="reset-btn" onclick="resetUI()">Analyze Another Image</button>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
